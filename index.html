<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETİ SODA – Ekipman Arşivi</title>
<style>
:root {
  --org:     #E8630A;
  --org-dk:  #C45208;
  --org-lt:  rgba(232,99,10,.09);
  --nvy:     #1B3A6B;
  --nvy-2:   #243f72;
  --bg:      #EEF2F7;
  --card:    #FFFFFF;
  --bdr:     #DDE3EC;
  --txt:     #1A202C;
  --mut:     #64748B;
  --grn:     #16A34A;
  --red:     #DC2626;
  --blu:     #2563EB;
  --r6:6px; --r10:10px;
  --sh:    0 1px 4px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
  --sh-lg: 0 4px 16px rgba(0,0,0,.10), 0 16px 40px rgba(0,0,0,.10);
  --tw: 260px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);display:flex;flex-direction:column}

/* ── HEADER ─────────────────────────────────────── */
.hdr{background:linear-gradient(135deg,var(--nvy) 0%,#0d2249 100%);
  color:#fff;height:60px;padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.28);flex-shrink:0;z-index:100}
.hdr-l{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;background:var(--org);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;letter-spacing:-.5px;color:#fff;flex-shrink:0}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand small{font-size:11px;opacity:.58}
.hdr-stats{display:flex;gap:22px}
.stat .v{font-size:20px;font-weight:800;color:var(--org);line-height:1}
.stat .l{font-size:10px;opacity:.58;text-transform:uppercase;letter-spacing:.5px}
.hdr-r{display:flex;gap:8px}

/* ── TOOLBAR ─────────────────────────────────────── */
.toolbar{background:#fff;border-bottom:1px solid var(--bdr);
  padding:8px 18px;display:flex;align-items:center;gap:10px;
  flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.srch-box{position:relative;flex:1;max-width:500px}
.srch-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--mut);pointer-events:none;flex-shrink:0}
.srch-inp{width:100%;padding:8px 32px 8px 34px;border:2px solid var(--bdr);
  border-radius:8px;font-size:13px;outline:none;background:var(--bg);transition:all .2s}
.srch-inp:focus{border-color:var(--org);background:#fff}
.srch-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--mut);font-size:15px;
  line-height:1;padding:2px;display:none}
.srch-clr.vis{display:block}

/* ── BUTTONS ─────────────────────────────────────── */
.btn{padding:8px 14px;border-radius:var(--r6);border:none;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-org{background:var(--org);color:#fff}
.btn-org:hover{background:var(--org-dk);box-shadow:0 3px 10px rgba(232,99,10,.4)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-sec{background:var(--bg);color:var(--txt);border:1.5px solid var(--bdr)}
.btn-sec:hover{border-color:var(--org);color:var(--org)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:5px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:4px}
.btn-icon{padding:6px;background:transparent;border:none;cursor:pointer;
  color:var(--mut);border-radius:5px;transition:all .2s;line-height:1;font-size:14px}
.btn-icon:hover{background:var(--bg);color:var(--org)}
.btn-del{background:#FEF2F2;color:var(--red);border:1.5px solid #FECACA;
  padding:5px 10px;font-size:12px;border-radius:5px;font-weight:600;
  cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn-del:hover{background:var(--red);color:#fff}

/* ── LAYOUT ──────────────────────────────────────── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── TREE PANEL ──────────────────────────────────── */
.tree-panel{width:var(--tw);background:#fff;border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.tree-hdr{padding:11px 14px;font-size:10px;font-weight:700;color:var(--mut);
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--bdr);
  flex-shrink:0}
.tree-scroll{overflow-y:auto;flex:1;padding-bottom:4px}
.tree-node{display:flex;align-items:center;min-height:33px;cursor:default;
  border-left:3px solid transparent;transition:background .12s;position:relative;
  user-select:none}
.tree-node:hover{background:var(--bg)}
.tree-node.sel{background:var(--org-lt);border-left-color:var(--org)}
.t-arrow{width:20px;flex-shrink:0;text-align:center;font-size:9px;color:var(--mut);
  padding:9px 0;cursor:pointer;transition:transform .18s}
.t-arrow.open{transform:rotate(90deg)}
.t-lbl{flex:1;font-size:13px;padding:8px 2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:pointer;min-width:0}
.tree-node.sel .t-lbl{color:var(--org);font-weight:600}
.t-code{font-size:10px;color:var(--mut);font-family:'Courier New',monospace;
  flex-shrink:0;padding-right:4px}
.t-cnt{background:var(--bg);color:var(--mut);border-radius:10px;
  padding:1px 7px;font-size:11px;font-weight:600;flex-shrink:0;margin-right:4px}
.tree-node.sel .t-cnt{background:var(--org);color:#fff}
.t-add{width:20px;height:20px;background:none;border:1.5px dashed var(--bdr);
  border-radius:4px;cursor:pointer;color:var(--mut);font-size:13px;
  display:none;align-items:center;justify-content:center;
  margin-right:6px;flex-shrink:0;line-height:1;padding:0;transition:all .15s}
.tree-node:hover .t-add{display:flex}
.t-add:hover{border-color:var(--org);color:var(--org);background:var(--org-lt)}
.tree-foot{padding:10px 12px;border-top:1px solid var(--bdr);flex-shrink:0}

/* ── MAIN AREA ───────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-hdr{padding:10px 20px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;
  background:#fff;flex-shrink:0;min-height:50px;gap:10px}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:13px;min-width:0;flex-wrap:wrap}
.bc-lnk{color:var(--mut);cursor:pointer;white-space:nowrap}
.bc-lnk:hover{color:var(--org)}
.bc-sep{color:var(--bdr);font-size:11px}
.bc-cur{color:var(--txt);font-weight:600;white-space:nowrap}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;
  cursor:pointer;color:var(--mut);font-size:13px;font-weight:500;
  padding:5px 8px;border-radius:6px;transition:all .15s;flex-shrink:0;white-space:nowrap}
.back-btn:hover{background:var(--bg);color:var(--org)}
.main-body{flex:1;overflow-y:auto;padding:20px}

/* ── CARDS GRID ──────────────────────────────────── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.eq-card{background:var(--card);border-radius:var(--r10);box-shadow:var(--sh);
  overflow:hidden;transition:all .2s;border:1px solid var(--bdr);cursor:pointer}
.eq-card:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
.eq-card-hdr{background:linear-gradient(135deg,var(--nvy) 0%,var(--nvy-2) 100%);
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.eq-tag{font-size:17px;font-weight:800;color:#fff;
  font-family:'Courier New',monospace;letter-spacing:.3px}
.eq-cat-badge{font-size:10px;color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.12);border-radius:4px;padding:2px 7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.eq-card-body{padding:11px 14px}
.eq-name{font-size:14px;font-weight:600;margin-bottom:7px;line-height:1.3}
.eq-name.none{color:var(--mut);font-style:italic;font-weight:400;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;font-family:'Courier New',monospace}
.chip-gray{background:var(--bg);color:var(--mut)}

.fault-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ftag{font-size:11px;background:#FFF7ED;color:#9A3412;
  border:1px solid #FED7AA;border-radius:20px;padding:2px 9px;font-weight:500}

.eq-foot{border-top:1px solid var(--bdr);padding-top:8px;
  display:flex;align-items:center;justify-content:space-between}
.doc-cnt{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:4px}

/* ── DETAIL VIEW ─────────────────────────────────── */
.detail-wrap{display:flex;gap:18px;align-items:flex-start}
.detail-info-box{width:310px;flex-shrink:0;background:var(--card);
  border-radius:var(--r10);box-shadow:var(--sh);border:1px solid var(--bdr);overflow:hidden}
.dib-hdr{background:linear-gradient(135deg,var(--nvy) 0%,var(--nvy-2) 100%);padding:14px 16px}
.dib-tag{font-size:22px;font-weight:800;color:#fff;font-family:'Courier New',monospace;margin-bottom:2px}
.dib-name{font-size:13px;color:rgba(255,255,255,.75)}
.dib-body{padding:14px 16px}
.irow{margin-bottom:10px}
.irow-lbl{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:2px}
.irow-val{font-size:13px;font-weight:500;font-family:'Courier New',monospace}
.irow-val.plain{font-family:inherit}
.dib-actions{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;gap:8px}

.detail-docs-box{flex:1;background:var(--card);border-radius:var(--r10);
  box-shadow:var(--sh);border:1px solid var(--bdr);overflow:hidden;min-width:0}
.ddb-hdr{padding:12px 16px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;background:#FAFBFC}
.ddb-ttl{font-size:13px;font-weight:700}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s}
.doc-row:last-child{border-bottom:none}
.doc-row:hover{background:var(--bg)}
.doc-ico{font-size:20px;flex-shrink:0}
.doc-inf{flex:1;min-width:0}
.doc-nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:11px;color:var(--mut);margin-top:1px}
.doc-acts{display:flex;gap:2px;opacity:0;transition:.12s}
.doc-row:hover .doc-acts{opacity:1}

/* ── SEARCH RESULTS ──────────────────────────────── */
.srch-hdr{margin-bottom:14px}
.srch-hdr h2{font-size:15px;font-weight:700;margin-bottom:3px}
.srch-hdr p{font-size:12px;color:var(--mut)}

/* ── EMPTY STATE ─────────────────────────────────── */
.empty{text-align:center;padding:70px 30px;color:var(--mut)}
.empty-ico{font-size:52px;margin-bottom:12px}
.empty-ttl{font-size:18px;font-weight:600;color:var(--txt);margin-bottom:7px}
.empty-txt{font-size:13px;max-width:360px;margin:0 auto 18px;line-height:1.6}

/* ── FAULT TAG INPUT ─────────────────────────────── */
.ftag-wrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  border:2px solid var(--bdr);border-radius:8px;padding:6px 8px;
  cursor:text;transition:border-color .2s;min-height:42px}
.ftag-wrap:focus-within{border-color:var(--org)}
.ftag-inp{border:none;outline:none;font-size:13px;background:transparent;
  min-width:130px;flex:1;padding:1px 0}
.ftag-item{display:inline-flex;align-items:center;gap:4px;
  background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA;
  border-radius:20px;padding:2px 8px 2px 10px;font-size:12px;font-weight:500}
.ftag-x{background:none;border:none;cursor:pointer;color:#9A3412;
  font-size:14px;line-height:1;padding:0;opacity:.65}
.ftag-x:hover{opacity:1}

/* ── MODALS ──────────────────────────────────────── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);
  z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh-lg);
  width:90%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hdr{padding:16px 20px 12px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-ttl{font-size:16px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-ftr{padding:12px 20px;border-top:1px solid var(--bdr);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* form */
.frow{margin-bottom:14px}
.frow label{display:block;font-size:11px;font-weight:700;color:var(--mut);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.finp,.fsel{width:100%;padding:9px 11px;border:2px solid var(--bdr);
  border-radius:7px;font-size:13px;outline:none;background:#fff;
  transition:border-color .2s;font-family:inherit}
.finp:focus,.fsel:focus{border-color:var(--org)}
.f2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0 10px;
  font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* upload */
.drop-zone{border:3px dashed var(--bdr);border-radius:10px;padding:30px;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.drop-zone:hover,.drop-zone.over{border-color:var(--org);background:var(--org-lt)}
.drop-ico{font-size:38px;margin-bottom:8px}
.drop-ttl{font-size:14px;font-weight:600;margin-bottom:4px}
.drop-sub{font-size:12px;color:var(--mut)}
.upl-list{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.upl-item{background:var(--bg);border-radius:7px;padding:8px 12px;
  display:flex;align-items:center;gap:8px}
.upl-inf{flex:1;min-width:0}
.upl-nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upl-st{font-size:11px;color:var(--mut)}
.prog{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;margin-top:3px}
.prog-f{height:100%;background:var(--org);border-radius:2px;transition:width .3s}

/* viewer modal */
.viewer-modal{max-width:97vw;width:97vw;max-height:96vh;height:96vh}
.viewer-inner{display:flex;flex:1;overflow:hidden}
.viewer-pdf{flex:1;background:#525659}
.viewer-pdf iframe{width:100%;height:100%;border:none;display:block}
.viewer-side{width:260px;border-left:1px solid var(--bdr);overflow-y:auto;padding:14px;flex-shrink:0}
.vs-sec{margin-bottom:16px}
.vs-ttl{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--bdr)}
.vs-row{margin-bottom:7px}
.vs-lbl{font-size:10px;color:var(--mut);margin-bottom:1px}
.vs-val{font-size:12px;font-weight:500;font-family:'Courier New',monospace;word-break:break-all}
.txt-prev{font-size:11px;line-height:1.6;color:var(--txt);white-space:pre-wrap;
  font-family:'Courier New',monospace;background:#F8FAFC;border-radius:5px;
  padding:8px;max-height:260px;overflow-y:auto}

/* ── TOAST ───────────────────────────────────────── */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:300;
  display:flex;flex-direction:column;gap:6px}
.toast{background:var(--txt);color:#fff;padding:10px 14px;border-radius:8px;
  font-size:13px;font-weight:500;box-shadow:var(--sh-lg);
  animation:tin .28s ease;display:flex;align-items:center;gap:7px;max-width:290px}
.toast.ok{background:var(--grn)}
.toast.err{background:var(--red)}
.toast.info{background:var(--nvy)}
@keyframes tin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── SCROLLBAR ───────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--mut)}

@media(max-width:768px){
  .tree-panel{display:none}
  .hdr-stats{display:none}
  .detail-wrap{flex-direction:column}
  .detail-info-box{width:100%}
  .viewer-side{display:none}
  .viewer-modal{max-width:100vw;width:100vw;max-height:100vh;height:100vh;border-radius:0}
  .f2col{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══════════════ HEADER ═══════════════════════════ -->
<header class="hdr">
  <div class="hdr-l">
    <div class="logo">ETİ</div>
    <div class="brand">
      <h1>ETİ SODA</h1>
      <small>Ekipman Dokümantasyon Arşivi</small>
    </div>
  </div>
  <div class="hdr-stats">
    <div class="stat"><div class="v" id="sEq">0</div><div class="l">Ekipman</div></div>
    <div class="stat"><div class="v" id="sDoc">0</div><div class="l">Belge</div></div>
    <div class="stat"><div class="v" id="sCat">0</div><div class="l">Kategori</div></div>
  </div>
  <div class="hdr-r">
    <button class="btn btn-ghost" onclick="App.openEquipModal()">+ Ekipman</button>
    <button class="btn btn-org" onclick="App.openUploadModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      PDF Yükle
    </button>
  </div>
</header>

<!-- ═══════════════ TOOLBAR ══════════════════════════ -->
<div class="toolbar">
  <div class="srch-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="srch-inp" id="srchInp" type="text"
      placeholder="Tag no, arıza tanımı veya belge içeriğinde ara…"
      oninput="App.handleSearch(this.value)">
    <button class="srch-clr" id="srchClr" onclick="App.clearSearch()">✕</button>
  </div>
</div>

<!-- ═══════════════ BODY ══════════════════════════════ -->
<div class="layout">

  <!-- TREE PANEL -->
  <aside class="tree-panel">
    <div class="tree-hdr">Kategoriler</div>
    <div class="tree-scroll" id="treeScroll"></div>
    <div class="tree-foot">
      <button class="btn btn-sec btn-sm" style="width:100%" onclick="App.openCatModal(null)">
        + Yeni Kategori
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="main-hdr" id="mainHdr"></div>
    <div class="main-body" id="mainBody"></div>
  </div>
</div>

<!-- ═══════════════ EQUIP MODAL ══════════════════════ -->
<div class="overlay" id="equipOverlay">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-ttl" id="equipModalTtl">Ekipman Ekle</span>
      <button class="btn-icon" onclick="App.closeEquipModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="fId">
      <div class="f2col">
        <div class="frow">
          <label>Tag No <span style="color:var(--red)">*</span></label>
          <input class="finp" id="fTagNo" placeholder="örn: C1104-A">
        </div>
        <div class="frow">
          <label>Kategori <span style="color:var(--red)">*</span></label>
          <select class="fsel" id="fCatId"></select>
        </div>
      </div>
      <div class="frow">
        <label>Ekipman Adı</label>
        <input class="finp" id="fName" placeholder="örn: Kompresör, Pompa, Isı Değiştirici…">
      </div>
      <div class="f2col">

/* ═══════════════════════════════════════════════════
   IndexedDB
   ═══════════════════════════════════════════════════ */
const IDB = (() => {
  const NAME='EtiSodaV2', VER=1;
  let db=null;

  function open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(NAME,VER);
      r.onupgradeneeded=e=>{
        const d=e.target.result;
        ['cats','equips','docs','blobs'].forEach(s=>{
          if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'});
        });
      };
      r.onsuccess=e=>{db=e.target.result;res()};
      r.onerror=rej;
    });
  }
  function getAll(s){return new Promise((res,rej)=>{
    const r=db.transaction(s).objectStore(s).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=rej;
  });}
  function getOne(s,k){return new Promise((res,rej)=>{
    const r=db.transaction(s).objectStore(s).get(k);
    r.onsuccess=()=>res(r.result); r.onerror=rej;
  });}
  function put(s,obj){return new Promise((res,rej)=>{
    const t=db.transaction(s,'readwrite');
    t.objectStore(s).put(obj); t.oncomplete=res; t.onerror=rej;
  });}
  function del(stores,id){
    const arr=Array.isArray(stores)?stores:[stores];
    return new Promise((res,rej)=>{
      const t=db.transaction(arr,'readwrite');
      arr.forEach(s=>t.objectStore(s).delete(id));
      t.oncomplete=res; t.onerror=rej;
    });
  }
  return {
    init:        ()          => open(),
    getAllCats:   ()          => getAll('cats'),
    saveCat:     c           => put('cats',c),
    delCat:      id          => del('cats',id),
    getAllEquips: ()          => getAll('equips'),
    saveEquip:   e           => put('equips',e),
    delEquip:    id          => del('equips',id),
    getAllDocs:   ()          => getAll('docs'),
    saveDoc:     d           => put('docs',d),
    delDoc:      id          => del(['docs','blobs'],id),
    saveBlob:    (id,blob)   => put('blobs',{id,blob}),
    getBlob:     id          => getOne('blobs',id).then(r=>r?.blob),
  };
})();

/* ═══════════════════════════════════════════════════
   PDF Text Extractor  (pure JS, no external libs)
   ═══════════════════════════════════════════════════ */
const PDFReader = (() => {
  function dec(s){
    return s.replace(/\\n/g,' ').replace(/\\r/g,' ').replace(/\\t/g,' ')
      .replace(/\\([0-7]{3})/g,(_,o)=>String.fromCharCode(parseInt(o,8)))
      .replace(/\\\(/g,'(').replace(/\\\)/g,')').replace(/\\\\/g,'\\');
  }
  function fromBlock(blk,out){
    let m,r=/\(([^)]{0,400})\)\s*Tj/g;
    while((m=r.exec(blk))){const s=dec(m[1]).trim();if(s)out.push(s);}
    r=/\[([^\]]{0,800})\]\s*TJ/g;
    while((m=r.exec(blk))){
      const ri=/\(([^)]{0,200})\)/g;let mi;
      while((mi=ri.exec(m[1]))){const s=dec(mi[1]).trim();if(s)out.push(s);}
    }
  }
  async function extract(file){
    const ab=await file.arrayBuffer();
    const bytes=new Uint8Array(ab);
    let raw='';
    for(let i=0;i<bytes.length;i++) raw+=String.fromCharCode(bytes[i]);
    const out=[];
    const re=/BT([\s\S]{0,4000}?)ET/g; let m;
    while((m=re.exec(raw))) fromBlock(m[1],out);
    if(out.length<5){
      const rs=/\(([^\)\\]{4,120})\)/g;
      while((m=rs.exec(raw))){
        const s=dec(m[1]).trim();
        if(/[A-Za-z0-9ğüşıöçĞÜŞİÖÇ]{3,}/.test(s)) out.push(s);
      }
    }
    const pages=(raw.match(/\/Type\s*\/Page[^s]/g)||[]).length||1;
    return {text:out.join(' ').replace(/\s+/g,' ').trim(), pages};
  }
  return {extract};
})();

/* ═══════════════════════════════════════════════════
   Category Helpers
   ═══════════════════════════════════════════════════ */
function buildTree(cats){
  const map={},roots=[];
  cats.forEach(c=>map[c.id]={...c,_ch:[]});
  cats.forEach(c=>{
    if(c.parent&&map[c.parent]) map[c.parent]._ch.push(map[c.id]);
    else if(!c.parent) roots.push(map[c.id]);
  });
  return {map,roots};
}

function getDescendants(catId,cats){
  const ids=[];
  cats.filter(c=>c.parent===catId).forEach(c=>{ids.push(c.id);ids.push(...getDescendants(c.id,cats));});
  return ids;
}

function getCatPath(catId,cats){
  const path=[];
  let cur=cats.find(c=>c.id===catId);
  while(cur){path.unshift(cur);cur=cur.parent?cats.find(c=>c.id===cur.parent):null;}
  return path;
}

function eqCount(catId,cats,equips){
  const ids=[catId,...getDescendants(catId,cats)];
  return equips.filter(e=>ids.includes(e.catId)).length;
}

function treeNodeHTML(node,depth,map){
  const hasKids = node._ch.length>0;
  const isOpen  = S.openCats.has(node.id);
  const isSel   = S.catId===node.id && S.view!=='search';
  const cnt     = eqCount(node.id,S.cats,S.equips);
  const indent  = 10+depth*16;

  const kids = isOpen&&hasKids
    ? node._ch.map(c=>treeNodeHTML(map[c.id],depth+1,map)).join('')
    : '';

  return `<div class="tree-node ${isSel?'sel':''}" style="padding-left:${indent}px">
    <span class="t-arrow ${isOpen&&hasKids?'open':''}"
      onclick="event.stopPropagation();App.toggleCat('${node.id}')">
      ${hasKids?'▶':'&nbsp;'}

    ${node.code?`<span class="t-code">${node.code}</span>`:''}

    <button class="t-add" onclick="event.stopPropagation();App.openCatModal('${node.id}')"
      title="Alt kategori ekle">+</button>
  </div>${kids}`;
}

    return sep+`<span class="bc-lnk" onclick="App.selectCat('${c.id}')">${esc(c.label)}</span>`;
  }).join('');
}

  const hdr=`<div class="srch-hdr">
    <h2>Arama: "${esc(S.query)}"</h2>
    <p>${results.length} ekipman bulundu</p>
  </div>`;
  if(!results.length) return hdr+`<div class="empty">
    <div class="empty-ico">🔍</div>
    <div class="empty-ttl">Sonuç bulunamadı</div>
    <div class="empty-txt">Farklı arama terimleri deneyin.</div>
  </div>`;
  return hdr+`<div class="cards-grid">${results.map(eqCardHTML).join('')}</div>`;
}

/* ═══════════════════════════════════════════════════
   Full Re-render
   ═══════════════════════════════════════════════════ */
function rerender(){
  updateStats();
  renderTree();
  renderMainHdr();
  const body=document.getElementById('mainBody');
  if(S.view==='detail')      body.innerHTML=renderDetail();
  else if(S.view==='search') body.innerHTML=renderSearch();
  else                       body.innerHTML=renderCards();
}

/* ═══════════════════════════════════════════════════
   Category & Equipment Select Helpers
   ═══════════════════════════════════════════════════ */
function populateCatSel(selId,selectedId){
  const {roots,map}=buildTree(S.cats);
  function opts(nodes,depth){
    return nodes.map(n=>{
      const indent='  '.repeat(depth*2);
      const prefix=depth>0?indent+'└ ':'';
      const lbl=prefix+n.label+(n.code?' ('+n.code+')':'');
      const sel=n.id===selectedId?'selected':'';
      return `<option value="${n.id}" ${sel}>${lbl}</option>`
        +opts(n._ch.map(c=>map[c.id]),depth+1).join('');
    }).join('');
  }
  document.getElementById(selId).innerHTML=
    `<option value="">— Kategori seçin —</option>`+opts(roots,0);
}

function populateEqSel(selId,selectedId){
  const opts=[...S.equips].sort((a,b)=>a.tagNo.localeCompare(b.tagNo))
    .map(e=>`<option value="${e.id}" ${e.id===selectedId?'selected':''}>`
      +`${esc(e.tagNo)}${e.name?' – '+esc(e.name):''}</option>`).join('');
  document.getElementById(selId).innerHTML=`<option value="">— Ekipman seçin —</option>`+opts;
}

/* ═══════════════════════════════════════════════════
   Fault Tag Render
   ═══════════════════════════════════════════════════ */
function renderFaultTags(){
  const wrap=document.getElementById('ftagWrap');
  const inp=document.getElementById('ftagInp');
  wrap.querySelectorAll('.ftag-item').forEach(el=>el.remove());
  S.pendingFaults.forEach((f,i)=>{
    const el=document.createElement('span');
    el.className='ftag-item';
    el.innerHTML=`${esc(f)}<button class="ftag-x" onclick="App.removeFault(${i})">×</button>`;
    wrap.insertBefore(el,inp);
  });
}

/* ═══════════════════════════════════════════════════
   App Controller
   ═══════════════════════════════════════════════════ */
const App={

  /* Navigation */
  toggleCat(id){
    S.openCats.has(id)?S.openCats.delete(id):S.openCats.add(id);
    renderTree();
  },
  selectCat(id){
    let cur=S.cats.find(c=>c.id===id);
    while(cur){S.openCats.add(cur.id);cur=cur.parent?S.cats.find(c=>c.id===cur.parent):null;}
    S.catId=id; S.eqId=null; S.view='cards'; S.query='';
    document.getElementById('srchInp').value='';
    document.getElementById('srchClr').classList.remove('vis');
    rerender();
  },
  selectEquip(id){S.eqId=id;S.view='detail';rerender();},
  back(){S.eqId=null;S.view='cards';rerender();},

  /* Search */
  _stmr:null,
  handleSearch(v){
    document.getElementById('srchClr').classList.toggle('vis',v.length>0);
    clearTimeout(this._stmr);
    this._stmr=setTimeout(()=>{
      S.query=v; S.view=v.trim()?'search':'cards'; S.eqId=null;
      renderMainHdr();
      const body=document.getElementById('mainBody');
      body.innerHTML=S.view==='search'?renderSearch():renderCards();
    },180);
  },
  clearSearch(){
    document.getElementById('srchInp').value='';
    document.getElementById('srchClr').classList.remove('vis');
    S.query=''; S.view='cards'; rerender();
  },

  /* Equipment Modal */
  openEquipModal(eqId,catId){
    const eq=eqId?S.equips.find(e=>e.id===eqId):null;
    document.getElementById('equipModalTtl').textContent=eq?'Ekipman Düzenle':'Ekipman Ekle';
    document.getElementById('fId').value     =eq?.id||'';
    document.getElementById('fTagNo').value  =eq?.tagNo||'';
    document.getElementById('fName').value   =eq?.name||'';
    document.getElementById('fModel').value  =eq?.model||'';
    document.getElementById('fSerial').value =eq?.serialNo||'';
    S.pendingFaults=[...(eq?.faults||[])];
    renderFaultTags();
    populateCatSel('fCatId',eq?.catId||catId||S.catId||'');
    document.getElementById('equipOverlay').classList.add('show');
    setTimeout(()=>document.getElementById('fTagNo').focus(),80);
  },
  closeEquipModal(){
    document.getElementById('equipOverlay').classList.remove('show');
    S.pendingFaults=[];
  },
  faultKey(e){
    if(e.key==='Enter'||e.key===','){
      e.preventDefault();
      const v=e.target.value.replace(/,$/,'').trim();
      if(v&&!S.pendingFaults.includes(v)){S.pendingFaults.push(v);renderFaultTags();}
      e.target.value='';
    }
    if(e.key==='Backspace'&&!e.target.value&&S.pendingFaults.length){
      S.pendingFaults.pop();renderFaultTags();
    }
  },
  removeFault(i){S.pendingFaults.splice(i,1);renderFaultTags();},

  async saveEquip(){
    const tagNo=document.getElementById('fTagNo').value.trim().toUpperCase();
    const catId=document.getElementById('fCatId').value;
    if(!tagNo){toast('Tag No zorunludur','error');return;}
    if(!catId){toast('Lütfen kategori seçin','error');return;}
    const id=document.getElementById('fId').value||uid();
    const eq={
      id, tagNo, catId,
      name:    document.getElementById('fName').value.trim(),
      model:   document.getElementById('fModel').value.trim(),
      serialNo:document.getElementById('fSerial').value.trim(),
      faults:  [...S.pendingFaults],
    };
    await IDB.saveEquip(eq);
    const idx=S.equips.findIndex(e=>e.id===id);
    if(idx>=0) S.equips[idx]=eq; else S.equips.push(eq);
    this.closeEquipModal();
    rerender();
    toast(idx>=0?'Ekipman güncellendi':'Ekipman eklendi','success');
  },

  async deleteEquip(eqId){
    if(!confirm('Bu ekipmanı ve tüm belgelerini silmek istediğinizden emin misiniz?')) return;
    for(const d of S.docs.filter(d=>d.eqId===eqId)) await IDB.delDoc(d.id);
    S.docs=S.docs.filter(d=>d.eqId!==eqId);
    await IDB.delEquip(eqId);
    S.equips=S.equips.filter(e=>e.id!==eqId);
    S.eqId=null; S.view='cards';
    rerender(); toast('Ekipman silindi','info');
  },

  /* Upload Modal */
  openUploadModal(eqId){
    S.uploadQueue=[]; S.uploadEqId=eqId||null;
    document.getElementById('uplList').innerHTML='';
    document.getElementById('uplBtn').style.display='none';
    populateEqSel('uplEqSel',eqId||'');
    document.getElementById('uploadOverlay').classList.add('show');
  },
  closeUploadModal(){
    document.getElementById('uploadOverlay').classList.remove('show');
    S.uploadQueue=[]; S.uploadEqId=null;
  },
  onUplEqChange(v){S.uploadEqId=v||null;},
  dragOver(e) {e.preventDefault();document.getElementById('dropZone').classList.add('over');},
  dragLeave() {document.getElementById('dropZone').classList.remove('over');},
  drop(e){
    e.preventDefault();
    document.getElementById('dropZone').classList.remove('over');
    this._addFiles([...e.dataTransfer.files].filter(f=>f.name.toLowerCase().endsWith('.pdf')));
  },
  fileSelect(e){this._addFiles([...e.target.files]);e.target.value='';},
  _addFiles(files){
    files.forEach(f=>S.uploadQueue.push({id:uid(),file:f}));
    this._renderUplList();
    document.getElementById('uplBtn').style.display=S.uploadQueue.length?'inline-flex':'none';
  },
  _renderUplList(){
    document.getElementById('uplList').innerHTML=S.uploadQueue.map(item=>`
      <div class="upl-item" id="ui-${item.id}">
        <span style="font-size:20px">📄</span>
        <div class="upl-inf">
          <div class="upl-nm">${esc(item.file.name)}</div>
          <div class="upl-st" id="us-${item.id}">${fmtS(item.file.size)} · Hazır</div>
          <div class="prog"><div class="prog-f" id="up-${item.id}" style="width:0%"></div></div>
        </div>
      </div>`).join('');
  },
  _setP(id,txt,pct,done,err){
    const s=document.getElementById('us-'+id);
    const p=document.getElementById('up-'+id);
    if(s) s.textContent=txt;
    if(p){p.style.width=pct+'%';if(done)p.style.background='var(--grn)';if(err)p.style.background='var(--red)';}
  },
  async processUpload(){
    if(!S.uploadEqId){toast('Lütfen ekipman seçin','error');return;}
    if(!S.uploadQueue.length){toast('Lütfen dosya seçin','error');return;}
    const btn=document.getElementById('uplBtn');
    btn.disabled=true;
    btn.innerHTML='<span class="spin"></span> İşleniyor…';
    let ok=0,fail=0;
    for(const item of S.uploadQueue){
      try{
        this._setP(item.id,'Metin çıkarılıyor…',30);
        const {text,pages}=await PDFReader.extract(item.file);
        this._setP(item.id,'Kaydediliyor…',75);
        const doc={id:item.id,eqId:S.uploadEqId,filename:item.file.name,
          uploadDate:new Date().toISOString(),pages,size:item.file.size,
          textContent:text.substring(0,60000)};
        await IDB.saveBlob(item.id,item.file);
        await IDB.saveDoc(doc);
        S.docs.push(doc);
        this._setP(item.id,'✅ Tamamlandı',100,true);
        ok++;
      }catch(e){
        console.error(e);
        this._setP(item.id,'❌ '+e.message,0,false,true);
        fail++;
      }
    }
    btn.disabled=false; btn.innerHTML='Yükle'; S.uploadQueue=[];
    if(ok) toast(`${ok} belge yüklendi`,'success');
    if(fail) toast(`${fail} belge işlenemedi`,'error');
    if(ok){
      this.closeUploadModal();
      if(S.view==='detail'&&S.eqId===S.uploadEqId){
        document.getElementById('mainBody').innerHTML=renderDetail();
      } else { rerender(); }
    }
  },

  /* Category Modal */
  openCatModal(parentId){
    document.getElementById('catParentId').value=parentId||'';
    const parent=parentId?S.cats.find(c=>c.id===parentId):null;
    document.getElementById('catModalTtl').textContent=parent?'Alt Kategori Ekle':'Kategori Ekle';
    document.getElementById('catParentLbl').textContent=parent?parent.label:'Kök seviye';
    document.getElementById('catName').value='';
    document.getElementById('catCode').value='';
    document.getElementById('catOverlay').classList.add('show');
    setTimeout(()=>document.getElementById('catName').focus(),80);
  },
  closeCatModal(){document.getElementById('catOverlay').classList.remove('show');},
  async saveCat(){
    const label=document.getElementById('catName').value.trim();
    if(!label){toast('Kategori adı zorunludur','error');return;}
    const parent=document.getElementById('catParentId').value||null;
    const code=document.getElementById('catCode').value.trim()||null;
    const cat={id:uid(),label,parent,code};
    await IDB.saveCat(cat);
    S.cats.push(cat);
    if(parent) S.openCats.add(parent);
    this.closeCatModal();
    rerender(); toast('Kategori eklendi','success');
  },

  /* PDF Viewer */
  async openViewer(docId){
    const doc=S.docs.find(d=>d.id===docId);
    if(!doc) return;
    S.viewDocId=docId;
    document.getElementById('viewerTtl').textContent=doc.filename;
    document.getElementById('viewerOverlay').classList.add('show');
    if(S.blobUrl){URL.revokeObjectURL(S.blobUrl);S.blobUrl=null;}
    const blob=await IDB.getBlob(docId);
    if(blob){S.blobUrl=URL.createObjectURL(blob);document.getElementById('pdfFrame').src=S.blobUrl;}
    const eq=S.equips.find(e=>e.id===doc.eqId);
    const row=(l,v)=>v?`<div class="vs-row"><div class="vs-lbl">${l}</div><div class="vs-val">${esc(v)}</div></div>`:'';
    document.getElementById('viewerSide').innerHTML=`
      <div class="vs-sec">
        <div class="vs-ttl">Belge</div>
        ${row('Dosya Adı',doc.filename)}
        ${row('Tarih',fmtD(doc.uploadDate))}
        ${row('Boyut',fmtS(doc.size))}
        ${row('Sayfa',String(doc.pages||'–'))}
      </div>
      ${eq?`<div class="vs-sec">
        <div class="vs-ttl">Ekipman</div>
        ${row('Tag No',eq.tagNo)}
        ${row('Adı',eq.name)}
        ${row('Model',eq.model)}
        ${row('Seri No',eq.serialNo)}
        ${(eq.faults||[]).length?`<div class="vs-row"><div class="vs-lbl">Arıza Tanımları</div>
          <div class="fault-tags" style="margin-top:4px">
            ${(eq.faults||[]).map(f=>`<span class="ftag">${esc(f)}</span>`).join('')}
          </div></div>`:''}
      </div>`:''}
      ${doc.textContent?`<div class="vs-sec">
        <div class="vs-ttl">Metin Önizleme</div>
        <div class="txt-prev">${esc(doc.textContent.substring(0,1000))}${doc.textContent.length>1000?'…':''}</div>
      </div>`:''}`;
  },
  closeViewer(){
    document.getElementById('viewerOverlay').classList.remove('show');
    if(S.blobUrl){URL.revokeObjectURL(S.blobUrl);S.blobUrl=null;}
    document.getElementById('pdfFrame').src='';
    S.viewDocId=null;
  },
  async downloadDoc(){
    if(!S.viewDocId) return;
    const doc=S.docs.find(d=>d.id===S.viewDocId);
    const blob=await IDB.getBlob(S.viewDocId);
    if(!blob){toast('Dosya bulunamadı','error');return;}
    const url=URL.createObjectURL(blob);
    Object.assign(document.createElement('a'),{href:url,download:doc.filename}).click();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  },
  async deleteDoc(docId){
    if(!confirm('Bu belgeyi silmek istediğinizden emin misiniz?')) return;
    await IDB.delDoc(docId);
    S.docs=S.docs.filter(d=>d.id!==docId);
    document.getElementById('mainBody').innerHTML=renderDetail();
    updateStats(); toast('Belge silindi','info');
  },
};

/* ─── Overlay close on backdrop click ──────────────── */
[['equipOverlay',  ()=>App.closeEquipModal()],
 ['uploadOverlay', ()=>App.closeUploadModal()],
 ['catOverlay',    ()=>App.closeCatModal()],
 ['viewerOverlay', ()=>App.closeViewer()],
].forEach(([id,fn])=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget)fn();});
});

/* ─── Keyboard ──────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    App.closeViewer(); App.closeEquipModal();
    App.closeUploadModal(); App.closeCatModal();
  }
});

/* ═══════════════════════════════════════════════════
   Boot
   ═══════════════════════════════════════════════════ */
(async()=>{
  await IDB.init();
  const [cats,equips,docs]=await Promise.all([
    IDB.getAllCats(), IDB.getAllEquips(), IDB.getAllDocs(),
  ]);

  if(cats.length===0){
    for(const c of DEFAULT_CATS) await IDB.saveCat(c);
    S.cats=[...DEFAULT_CATS];
  } else {
    S.cats=cats;
    // ensure default cats exist (migration)
    for(const dc of DEFAULT_CATS){
      if(!S.cats.find(c=>c.id===dc.id)){
        await IDB.saveCat(dc); S.cats.push(dc);
      }
    }
  }
  S.equips=equips; S.docs=docs;
  rerender();
})().catch(err=>{console.error(err);toast('Başlatma hatası: '+err.message,'error');});
</script>
